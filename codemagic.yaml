workflows:
  default:
    name: Release APK
    instance_type: mac_mini_m1
    max_build_duration: 20
    environment:
      flutter: stable
    scripts:
      - name: Create android folder
        script: |
          flutter create . --platforms=android
      - name: Build RELEASE APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/*.apk
